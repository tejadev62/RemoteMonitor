name: Android CI/CD

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.1, v1.2, etc.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-unsigned.apk # Or app-release.apk if signed
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        run: |
          VERSION_NAME=$(echo ${{ github.ref_name }} | sed 's/v//')
          VERSION_CODE=$(date +%s) # Simple way to generate a unique version code
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release-unsigned.apk"
          
          # Create or Update version.json
          cat <<EOF > backend/public/version.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "$APK_URL",
            "releaseNotes": "Release $VERSION_NAME auto-generated by GitHub Actions"
          }
          EOF

      - name: Commit and Push version.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/public/version.json
          git commit -m "Update version.json to ${{ github.ref_name }}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
