name: Android CI/CD

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug # Building debug for now as requested

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RemoteMonitor_${{ github.ref_name }}.apk

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/RemoteMonitor_${{ github.ref_name }}.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        run: |
          VERSION_NAME=$(echo ${{ github.ref_name }} | sed 's/v//')
          VERSION_CODE=$(date +%s)
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/RemoteMonitor_${{ github.ref_name }}.apk"
          
          # Ensure public directory exists
          mkdir -p backend/public
          
          # Create or Update version.json
          cat <<EOF > backend/public/version.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "$APK_URL",
            "releaseNotes": "Release $VERSION_NAME auto-generated by GitHub Actions"
          }
          EOF

      - name: Commit and Push version.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          git add backend/public/version.json
          git commit -m "Update version.json to ${{ github.ref_name }}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
